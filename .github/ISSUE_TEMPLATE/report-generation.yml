name: Report a generation problem
description: Report a repeatable failure in an existing visual Skill
title: "[Generation issue]: "
labels:
  - bug
body:
  - type: input
    id: skill
    attributes:
      label: Skill name
      description: Use the installed Skill name, such as editorial-painted-memory.
      placeholder: skill-name
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Agent and image model
      placeholder: Codex with GPT Image
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Invocation and extra instructions
      description: Include the exact request, excluding private or licensed source prompts.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Explain the visible failure and whether it repeats.
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: Reproducible image
      description: Attach or link an image only when you have permission to publish it.

  - type: checkboxes
    id: privacy
    attributes:
      label: Publication check
      options:
        - label: I removed private information and can publish the supplied image and instructions.
          required: true
